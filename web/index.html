<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图书馆座位预约助手</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">图书馆座位预约助手</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main class="wrap">

  <!-- ① 账号 -->
  <section class="card">
    <h2>账号</h2>
    <div class="row2">
      <label>学号
        <input id="username" autocomplete="off" placeholder="请输入学号" />
      </label>
      <label>密码
        <input id="password" type="password" autocomplete="off" placeholder="请输入密码" />
      </label>
    </div>
    <div class="btns">
      <button class="primary" id="btn-login">登录检测</button>
      <span class="tip" id="login-tip"></span>
    </div>
  </section>

  <!-- ② 预约参数 -->
  <section class="card">
    <h2>预约位置参数</h2>

    <label>自习室
      <span class="inline">
        <select id="space_select"><option value="">点击右侧按钮加载自习室</option></select>
        <button class="mini" id="btn-rooms">加载自习室</button>
      </span>
    </label>

    <div class="row2">
      <label>预约日期
        <select id="reserve_date"></select>
      </label>
      <label>座位
        <input id="seat_id" placeholder="点击下方「查询座位」后选择" />
      </label>
    </div>

    <div class="btns">
      <button class="primary" id="btn-seats">查询座位</button>
      <span class="tip" id="seat-tip"></span>
    </div>

    <div id="seats-out" class="out hidden"></div>
  </section>

  <!-- ③ 定时预约 -->
  <section class="card">
    <h2>定时预约</h2>

    <div class="row2">
      <label>定时日期
        <select id="fire_date"></select>
      </label>
      <label>定时时间
        <select id="fire_time">
          <option value="08:00">08:00</option>
          <option value="12:00">12:00</option>
          <option value="13:00">13:00</option>
          <option value="13:30" selected>13:30</option>
          <option value="18:00">18:00</option>
          <option value="19:00">19:00</option>
          <option value="21:00">21:00</option>
          <option value="22:00">22:00</option>
        </select>
      </label>
    </div>

    <label>预约时段
      <select id="slot">
        <option value="morning">上午（08:00 - 12:00）</option>
        <option value="afternoon" selected>下午（13:30 - 18:00）</option>
        <option value="evening">晚上（19:00 - 22:00）</option>
      </select>
    </label>

    <p class="hint" id="summary"></p>

    <div class="btns">
      <button class="primary" id="btn-start">开始定时</button>
      <button id="btn-test60">1分钟后测试</button>
      <button id="btn-verify">预约验证</button>
      <button id="btn-stop" class="danger">停止</button>
    </div>
    <p class="tip">「1分钟后测试」会在 1 分钟后按上面的时段自动发送一次预约请求，用来验证定时是否生效。
      「预约验证」则是立刻按<strong>今天下午 13:30–18:00</strong>下单一次。</p>

    <div class="state">
      <div><span class="k">状态</span><span class="v" id="st-status">空闲</span></div>
      <div><span class="k">将在</span><span class="v" id="st-fire">-</span></div>
      <div><span class="k">剩余</span><span class="v" id="st-left">-</span></div>
      <div><span class="k">已尝试</span><span class="v" id="st-attempts">0</span></div>
      <div class="wide"><span class="k">最近结果</span><span class="v" id="st-msg">-</span></div>
    </div>
  </section>

  <!-- ④ 运行日志 -->
  <section class="card">
    <h2>运行日志</h2>
    <div class="btns">
      <button class="mini" id="btn-clear-logs">清空</button>
      <label class="chk inline"><input type="checkbox" id="autoscroll" checked /> 自动滚动</label>
    </div>
    <pre id="logs" class="logs"></pre>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
